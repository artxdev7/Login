<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medias.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person,password" />
</head>

<body>
    <main>
        <img src="https://i.pinimg.com/736x/bf/38/4c/bf384c660a6aa65e0df503effc7fdf71.jpg" alt="">
        <h1>Login</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        <form action="" method="post">
            <div id="gmail">
                <label for="email"><span class="material-symbols-outlined" id="user">
                        person
                    </span></label>
                <input type="email" name="email" id="email" required placeholder="example@seuemail.com">
            </div>
            <div id="senha">
                <label for="passwor"><span class="material-symbols-outlined" id="password">
                        password
                    </span></label>
                <input type="password" name="password" id="passwor" required placeholder="password" minlength="0"
                    maxlength="8">
            </div>
            <div class="button">
                <input type="submit" value="enviar" class="e">
                <input type="reset" value="resetar" class="e">
            </div>
        </form>
    </main>
</body>

</html>
